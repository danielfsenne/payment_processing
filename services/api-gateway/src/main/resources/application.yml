server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/accounts/**
              filters:
                - StripPrefix=1
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/customers/**
              filters:
                - StripPrefix=1
            - id: customer-service-auth
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_ENDPOINT:http://localhost:4318/v1/traces}
