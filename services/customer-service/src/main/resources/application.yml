server:
  port: 8083

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customer_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-shared-secret-change-me-in-prod-32bytes}

app:
  admin:
    name: ${ADMIN_NAME:Admin}
    email: ${ADMIN_EMAIL:admin@payment-processing.local}
    document: ${ADMIN_DOCUMENT:00000000000}
    password: ${ADMIN_PASSWORD:admin12345}
