name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - common-security
          - customer-service
          - account-service
          - payment-service
          - payment-worker
          - notification-worker
          - api-gateway
    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      # account-service, customer-service, payment-service and notification-worker all
      # depend on common-security (see their pom.xml); it needs to be in the local Maven
      # repo before their own build can resolve it. Harmless no-op for services that
      # don't depend on it.
      - name: Install shared security module
        if: matrix.service != 'common-security'
        working-directory: services/common-security
        run: |
          chmod +x ./mvnw
          ./mvnw -B -q install -DskipTests

      - name: Build and test
        working-directory: services/${{ matrix.service }}
        run: |
          chmod +x ./mvnw
          ./mvnw -B test

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - working-directory: frontend
        run: npm test

      - working-directory: frontend
        run: npm run build

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  publish:
    name: publish (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, frontend, compose-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - customer-service
          - account-service
          - payment-service
          - payment-worker
          - notification-worker
          - api-gateway
          - frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # account-service, customer-service, payment-service and notification-worker
      # depend on the common-security module (a sibling directory under services/), so
      # their Dockerfile needs the repo root as build context to see it - everything
      # else keeps its own directory as context like before.
      - id: context
        run: |
          case "${{ matrix.service }}" in
            frontend)
              echo "path=frontend" >> "$GITHUB_OUTPUT"
              echo "file=frontend/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            account-service|customer-service|payment-service|notification-worker)
              echo "path=." >> "$GITHUB_OUTPUT"
              echo "file=services/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "path=services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
              echo "file=services/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: docker/build-push-action@v5
        with:
          context: ${{ steps.context.outputs.path }}
          file: ${{ steps.context.outputs.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/payment-processing-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/payment-processing-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
