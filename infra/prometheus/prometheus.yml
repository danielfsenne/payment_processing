global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8081"]

  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account-service:8082"]

  - job_name: customer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["customer-service:8083"]

  - job_name: payment-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-worker:8084"]

  - job_name: notification-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-worker:8085"]
