services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./infra/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"

  customer-service:
    build: ./services/customer-service
    environment:
      DB_HOST: postgres
      DB_NAME: customer_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-shared-secret-change-me-in-prod-32bytes}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@payment-processing.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build: ./services/account-service
    environment:
      DB_HOST: postgres
      DB_NAME: account_db
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-dev-only-shared-secret-change-me-in-prod-32bytes}
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    environment:
      DB_HOST: postgres
      DB_NAME: payment_db
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      ACCOUNT_SERVICE_URL: http://account-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8083
      JWT_SECRET: ${JWT_SECRET:-dev-only-shared-secret-change-me-in-prod-32bytes}
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8091:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-worker:
    build: ./services/payment-worker
    environment:
      DB_HOST: postgres
      DB_NAME: payment_db
      RABBITMQ_HOST: rabbitmq
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-worker:
    build: ./services/notification-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-dev-only-shared-secret-change-me-in-prod-32bytes}
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build: ./services/api-gateway
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8083
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8080:8080"
    depends_on:
      - payment-service
      - account-service
      - customer-service

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
